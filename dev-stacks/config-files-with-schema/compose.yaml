services:
  reader:
    image: busybox:1.36
    env_file: ./app.env
    volumes:
      - ./settings.yaml:/app/settings.yaml:ro
      - ./settings.json:/app/settings.json:ro
      - ./remote-schema.yaml:/app/remote-schema.yaml:ro
    command: ["sh", "-c", "cat /app/settings.yaml /app/settings.json /app/remote-schema.yaml; echo GREETING=$$GREETING; sleep 3600"]
