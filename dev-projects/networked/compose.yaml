services:
  server:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www; printf 'Dockgeek dev project\\n' > /www/index.html; exec httpd -f -p 80 -h /www"]
    networks: ["internal"]
  client:
    image: busybox:1.36
    networks: ["internal"]
    depends_on: ["server"]
    command: ["sh", "-c", "wget -q -O /dev/null http://server/ && echo network-ready; sleep 3600"]
networks:
  internal: {}
